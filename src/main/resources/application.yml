server:
  port: 8081
  servlet:
    context-path: /order-pulse

spring:
  application:
    name: orderpulse

  data:
    mongodb:
      uri: mongodb://admin:password@localhost:27017/orderpulse?authSource=admin

  cloud:
    function:
      definition: warehouseProcessor

    stream:
      bindings:
        # --- PRODUCER ---
        orderCreated-out-0:
          destination: orders.events.v1
          content-type: application/json

        # --- CONSUMER ---
        warehouseProcessor-in-0:
          destination: orders.events.v1
          group: warehouse-group
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000

      kafka:
        binder:
          brokers: localhost:9092
          auto-create-topics: true
          required-acks: all
          min-partition-count: 3
          configuration:
            request.timeout.ms: 2000
            delivery.timeout.ms: 3000
            retries: 0

        bindings:
          orderCreated-out-0:
            producer:
              sync: true

          warehouseProcessor-in-0:
            consumer:
              enable-dlq: true
              dlq-name: orders.events.v1.dlq

orderpulse:
  outbox:
    polling-interval-ms: 5000
    hospital-interval-ms: 1800000
    max-retries: 5

logging:
  level:
    root: INFO
    com.nsdev: DEBUG
    org.springframework.cloud.stream.binder.kafka: ERROR